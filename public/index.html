<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c96442">
<title>Interview Coach AI</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a68; --card:#fff; --line:#e3e1da; --accent:#c96442; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1e1d; --fg:#f0eee6; --muted:#a8a6a0; --card:#2a2928; --line:#3d3c3a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:720px; margin:0 auto; padding:16px 16px 0; display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  h1 { font-size:1.2rem; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; font-size:.9rem; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #log { flex:1; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
  .msg { padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); white-space:pre-wrap; max-width:90%; }
  .msg.assistant { align-self:flex-start; }
  .msg.user { align-self:flex-end; border-color:var(--accent); }
  .msg .who { font-size:.7rem; color:var(--muted); display:block; margin-bottom:2px; }
  #composer { position:sticky; bottom:0; background:var(--bg); padding:8px 0 calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .row button { flex:1 1 auto; }
  #mic { flex:1 1 100%; padding:14px; font-size:1.05rem; }
  #mic.rec { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width: 600px) {
    button { min-height:44px; }
    textarea { min-height:64px; max-height:30vh; }
    .msg { max-width:96%; }
    #send { flex:2 1 auto; }
  }
  textarea { width:100%; min-height:72px; padding:10px; font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); resize:vertical; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  #feedback { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-top:12px; }
  #feedback h2 { font-size:1.05rem; margin:16px 0 4px; }
  #feedback p { margin:6px 0; }
  .hint { color:var(--muted); font-size:.8rem; }
  .msg.model { align-self:stretch; max-width:100%; border-style:dashed; }
  .msg.model .mrow { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .msg.model .mrow button { flex:1 1 auto; font-size:.85rem; min-height:40px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .kcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .kcard h3 { font-size:.95rem; margin:0 0 8px; }
  .kline { display:block; padding:4px 0; cursor:pointer; }
  .blur .kline:not(.reveal) { filter:blur(6px); }
  .kres { margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); line-height:1.9; }
  .miss { color:#d1342f; text-decoration:underline; font-weight:600; }
  .kcard .row button { flex:1 1 auto; }
</style>
</head>
<body>
<main>
  <h1>Interview Coach AI</h1>
  <div class="sub">Product Support Specialist 面接の英語模擬面接</div>

  <div class="tabs">
    <button id="tabI" class="tab on">模擬面接</button>
    <button id="tabK" class="tab">カンペ音読</button>
  </div>

  <div id="viewI">
  <div class="bar">
    <button id="start" class="primary">面接を始める</button>
    <label><input type="checkbox" id="tts" checked> 質問を音声で読み上げ</label>
    <label><input type="checkbox" id="easy" checked> イージー(お手本を表示)</label>
    <label>質問数
      <select id="nq"><option>4</option><option selected>6</option><option>8</option></select>
    </label>
    <span id="progress" class="hint"></span>
  </div>

  <div id="log"></div>

  <div id="composer" hidden>
    <textarea id="answer" placeholder="Type your answer, or press the mic and speak (English)."></textarea>
    <div class="row">
      <button id="mic">🎤 話す</button>
      <button id="send" class="primary">回答を送信</button>
      <button id="finish">終了してフィードバック</button>
    </div>
    <div class="hint" id="micHint"></div>
  </div>

  <div id="feedback" hidden></div>
  </div><!-- /viewI -->

  <div id="viewK" hidden>
    <div class="bar">
      <button id="kEdit">📝 カンペを貼る/編集</button>
      <label>速度
        <select id="kRate"><option value="0.7">0.7</option><option value="0.85" selected>0.85</option><option value="1">1.0</option></select>
      </label>
      <label><input type="checkbox" id="kHide"> 文字をぼかす</label>
    </div>
    <div id="kEditor" hidden>
      <textarea id="kText" style="min-height:220px" placeholder="=== 場面名 ===&#10;英文をここに貼る"></textarea>
      <div class="row"><button id="kSave" class="primary">保存</button></div>
      <div class="hint">「=== 場面名 ===」の行で場面を区切ります。このスマホのブラウザ内にだけ保存され、サーバーには送られません。</div>
    </div>
    <div id="kCards"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let messages = [];       // {role, content}
let maxQ = 6;
let asked = 0;
let busy = false;

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderMd(md){
  return esc(md)
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .split(/\n{2,}/).map(p => p.startsWith('<h2>') ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}
function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<span class="who">${role === 'assistant' ? 'Interviewer' : 'You'}</span>` + esc(text);
  if (role === 'assistant') {
    const b = document.createElement('button');
    b.textContent = '🔊 もう一度聞く';
    b.style.cssText = 'display:block;margin-top:8px;font-size:.8rem;padding:4px 10px;min-height:0';
    b.onclick = () => speak(text, true);
    d.appendChild(b);
  }
  $('log').appendChild(d);
  d.scrollIntoView({ behavior:'smooth', block:'end' });
}
// iOS Safari only allows speech that was "unlocked" by a user tap.
// Call this synchronously inside a click handler before any await.
function unlockSpeech(){
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch {}
}
function speak(text, force = false){
  if ((!force && !$('tts').checked) || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en-US'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function setBusy(b){ busy = b; ['send','finish','mic','start'].forEach(id => $(id).disabled = b); }
function updateProgress(){ $('progress').textContent = `質問 ${Math.min(asked, maxQ)} / ${maxQ}`; }

function getPass(){ try { return localStorage.getItem('appPass') || ''; } catch { return ''; } }
function setPass(v){ try { localStorage.setItem('appPass', v); } catch {} }

async function post(url, body, retried = false){
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json','x-app-password': getPass()}, body: JSON.stringify(body) });
  if (r.status === 401 && !retried) {
    const p = prompt('合言葉を入力してください');
    if (p === null) throw new Error('合言葉が必要です');
    setPass(p.trim());
    return post(url, body, true);
  }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function nextQuestion(){
  setBusy(true);
  try {
    const { reply } = await post('/api/chat', { messages, maxQuestions: maxQ });
    messages.push({ role:'assistant', content: reply });
    asked++; updateProgress();
    addMsg('assistant', reply);
    speak(reply);
    showModel(); // easy mode: not awaited, so the UI stays usable
  } catch(e){ addMsg('assistant', 'Error: ' + e.message); }
  setBusy(false);
}

// Easy mode: show a model answer (reusing the user's own script wording) under each question.
async function showModel(){
  if (!$('easy').checked) return;
  const box = document.createElement('div');
  box.className = 'msg model';
  box.innerHTML = '<span class="who">お手本(イージーモード)</span><span class="mtext">お手本を作成中…</span>';
  $('log').appendChild(box);
  box.scrollIntoView({ behavior:'smooth', block:'end' });
  try {
    const { answer } = await post('/api/model-answer', { messages: messages.slice(-5), kanpe: loadK() });
    box.querySelector('.mtext').textContent = answer;
    const row = document.createElement('div'); row.className = 'mrow';
    const listen = document.createElement('button'); listen.textContent = '🔊 聞く'; listen.onclick = () => kSpeak(answer);
    const fill = document.createElement('button'); fill.textContent = '✍ 入力欄に入れる'; fill.onclick = () => { $('answer').value = answer; $('answer').focus(); };
    const mic = document.createElement('button'); mic.textContent = '🎤 音読チェック';
    const res = document.createElement('div'); res.className = 'kres';
    mic.onclick = () => kToggleMic(mic, answer, res);
    row.append(listen, fill, mic);
    box.append(row, res);
    box.scrollIntoView({ behavior:'smooth', block:'end' });
  } catch(e){ box.querySelector('.mtext').textContent = 'お手本を取得できませんでした: ' + e.message; }
}

$('start').onclick = async () => {
  unlockSpeech();
  messages = []; asked = 0; maxQ = +$('nq').value;
  $('log').innerHTML = ''; $('feedback').hidden = true; $('composer').hidden = false;
  // The API needs a first user turn; the server adds one if messages is empty,
  // but we must keep the alternation, so store it explicitly.
  messages.push({ role:'user', content:"Hello, I'm ready to start the interview." });
  await nextQuestion();
};

$('send').onclick = async () => {
  const text = $('answer').value.trim();
  if (!text || busy) return;
  unlockSpeech();
  $('answer').value = '';
  messages.push({ role:'user', content: text });
  addMsg('user', text);
  if (asked >= maxQ) { await finish(); return; }
  await nextQuestion();
};

async function finish(){
  setBusy(true);
  const box = $('feedback');
  box.hidden = false; box.textContent = 'フィードバックを作成中…';
  try {
    // Drop the synthetic opener from the transcript.
    const transcript = messages.slice(1);
    const { feedback } = await post('/api/feedback', { messages: transcript });
    box.innerHTML = renderMd(feedback);
    box.scrollIntoView({ behavior:'smooth' });
    saveSession(transcript, feedback);
  } catch(e){ box.textContent = 'Error: ' + e.message; }
  setBusy(false);
}
$('finish').onclick = finish;

function saveSession(transcript, feedback){
  try {
    const all = JSON.parse(localStorage.getItem('sessions') || '[]');
    all.push({ at: new Date().toISOString(), transcript, feedback });
    localStorage.setItem('sessions', JSON.stringify(all.slice(-20)));
  } catch {}
}

// Speech recognition (Chrome/Edge/Safari)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, base = '';
if (!SR) { $('mic').disabled = true; $('micHint').textContent = 'このブラウザは音声入力に未対応です(Chrome推奨)。テキストで回答できます。'; }
else {
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
  rec.onresult = (e) => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    $('answer').value = (base + ' ' + t).trim();
  };
  rec.onend = () => { listening = false; $('mic').textContent = '🎤 話す'; $('mic').classList.remove('rec'); };
  $('mic').onclick = () => {
    if (listening) { rec.stop(); return; }
    speechSynthesis.cancel?.();
    base = $('answer').value; listening = true;
    $('mic').textContent = '⏹ 停止'; $('mic').classList.add('rec');
    rec.start();
  };
}
// ---------- Script (カンペ) read-aloud mode ----------
function showTab(k){
  $('viewI').hidden = k; $('viewK').hidden = !k;
  $('tabI').classList.toggle('on', !k); $('tabK').classList.toggle('on', k);
  speechSynthesis.cancel?.();
  if (k) renderK();
}
$('tabI').onclick = () => showTab(false);
$('tabK').onclick = () => showTab(true);

function loadK(){ try { return localStorage.getItem('kanpe') || ''; } catch { return ''; } }
function parseK(t){
  const out = []; let cur = null;
  for (const raw of t.split(/\r?\n/)) {
    const m = raw.match(/^\s*=+\s*(.+?)\s*=+\s*$/);
    if (m) { cur = { title: m[1], lines: [] }; out.push(cur); continue; }
    if (!raw.trim()) continue;
    if (!cur) { cur = { title: 'カンペ', lines: [] }; out.push(cur); }
    cur.lines.push(raw.trim());
  }
  return out;
}
function kSpeak(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = +$('kRate').value;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en-US'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const tokNorm = (t) => t.toLowerCase().replace(/[^a-z0-9']/g, '');
function lcsMatch(ref, hyp){
  const n = ref.length, m = hyp.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = ref[i] === hyp[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ok = new Array(n).fill(false); let i = 0, j = 0;
  while (i < n && j < m) {
    if (ref[i] === hyp[j]) { ok[i] = true; i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  return ok;
}
function showCheck(box, fullText, heard){
  const toks = fullText.split(/\s+/).filter(Boolean);
  const ref = toks.map(tokNorm);
  const idx = ref.map((r, i) => r ? i : -1).filter(i => i >= 0);
  const hyp = heard.split(/\s+/).map(tokNorm).filter(Boolean);
  const ok = lcsMatch(idx.map(i => ref[i]), hyp);
  const good = new Set(idx.filter((_, k) => ok[k]));
  const pct = idx.length ? Math.round(100 * ok.filter(Boolean).length / idx.length) : 0;
  box.innerHTML = `<div class="hint">一致率 ${pct}%(赤い単語は聞き取れなかった/違った部分)</div>` +
    toks.map((t, i) => ref[i] && !good.has(i) ? `<span class="miss">${esc(t)}</span>` : esc(t)).join(' ');
}

let kRec = null, kActive = null;
function kStopRec(){ try { kRec && kRec.stop(); } catch {} }
function kToggleMic(btn, fullText, box){
  if (!SR) { box.textContent = 'このブラウザは音声認識に未対応です(Chrome/Safari推奨)。'; return; }
  if (kActive === btn) { kStopRec(); return; }
  kStopRec(); speechSynthesis.cancel?.();
  let heard = '';
  const r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.continuous = true;
  r.onresult = (e) => { heard = ''; for (let i = 0; i < e.results.length; i++) heard += ' ' + e.results[i][0].transcript; };
  r.onend = () => { btn.textContent = '🎤 音読チェック'; if (kActive === btn) kActive = null; showCheck(box, fullText, heard); };
  btn.textContent = '⏹ 終了して採点'; kActive = btn; kRec = r; r.start();
}

function renderK(){
  const cards = parseK(loadK());
  const wrap = $('kCards'); wrap.innerHTML = '';
  wrap.classList.toggle('blur', $('kHide').checked);
  if (!cards.length) { wrap.innerHTML = '<div class="hint">まだカンペがありません。「📝 カンペを貼る/編集」から貼り付けてください。</div>'; return; }
  for (const c of cards) {
    const full = c.lines.join(' ');
    const d = document.createElement('div'); d.className = 'kcard';
    const h = document.createElement('h3'); h.textContent = c.title; d.appendChild(h);
    for (const line of c.lines) {
      const s = document.createElement('span'); s.className = 'kline'; s.textContent = line;
      s.onclick = () => { s.classList.add('reveal'); kSpeak(line); };
      d.appendChild(s);
    }
    const row = document.createElement('div'); row.className = 'row';
    const play = document.createElement('button'); play.textContent = '▶ 全文を聞く'; play.onclick = () => kSpeak(full);
    const stop = document.createElement('button'); stop.textContent = '⏹'; stop.onclick = () => speechSynthesis.cancel();
    const mic = document.createElement('button'); mic.textContent = '🎤 音読チェック';
    const res = document.createElement('div'); res.className = 'kres'; res.hidden = false;
    mic.onclick = () => kToggleMic(mic, full, res);
    row.append(play, stop, mic); d.appendChild(row); d.appendChild(res);
    wrap.appendChild(d);
  }
}
$('kEdit').onclick = () => { $('kEditor').hidden = !$('kEditor').hidden; $('kText').value = loadK(); };
$('kSave').onclick = () => {
  try { localStorage.setItem('kanpe', $('kText').value); } catch {}
  $('kEditor').hidden = true; renderK();
};
$('kHide').onchange = renderK;
</script>
</body>
</html>
